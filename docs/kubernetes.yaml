apiVersion: v1
kind: Namespace
metadata:
  name: carddav-mcp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carddav-mcp
  namespace: carddav-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carddav-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carddav-mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Resolve and append the release digest before production use.
          image: forge.oddie.app/jlxq0/carddav-mcp:v0.1.3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9090
          env:
            - name: CARDDAV_MCP_RESOURCE_URL
              value: https://carddav-mcp.your-domain.example
            - name: CARDDAV_MCP_AUTHORIZATION_SERVER
              value: https://login.your-domain.example/oidc
            - name: CARDDAV_MCP_STALWART_DAV_BASE_URL
              value: https://dav.your-domain.example
            - name: CARDDAV_MCP_DCR_CLIENT_ID
              value: replace-with-your-public-client-id
            - name: CARDDAV_MCP_OAUTH_REDIRECT_URIS
              value: https://claude.ai/api/mcp/auth_callback
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: carddav-mcp
  namespace: carddav-mcp
spec:
  selector:
    app.kubernetes.io/name: carddav-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
