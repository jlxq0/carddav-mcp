name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: audit
        run: |
          [ -x ~/.cargo/bin/cargo-audit ] || cargo install --locked cargo-audit
          cargo audit
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1
        with: { command: check bans licenses sources }
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="/tmp/gitleaks.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$TARBALL" gitleaks
          rm -f "$TARBALL"
          gitleaks detect --source . --no-banner --redact

  docker:
    runs-on: ubuntu-22.04
    needs: cargo
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { persist-credentials: false }
      - name: Install buildctl
        env:
          BUILDKIT_VERSION: v0.30.0
          BUILDKIT_SHA256: 2da148c50540409988c837e62b72176e4a9ad7855548a2dd6ea1cd0c0d2d360d
        run: |
          set -euo pipefail
          TARBALL="/tmp/buildkit.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local --strip-components=0 -f "$TARBALL"
          rm -f "$TARBALL"
          buildctl --version
      - name: Install SBOM and vulnerability scanners
        env:
          SYFT_VERSION: 1.51.0
          SYFT_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          SYFT_TARBALL="/tmp/syft.tar.gz"
          TRIVY_TARBALL="/tmp/trivy.tar.gz"
          curl -sSL -o "$SYFT_TARBALL" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$TRIVY_TARBALL" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${SYFT_SHA256}  ${SYFT_TARBALL}" | sha256sum -c -
          echo "${TRIVY_SHA256}  ${TRIVY_TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$SYFT_TARBALL" syft
          sudo tar -xz -C /usr/local/bin -f "$TRIVY_TARBALL" trivy
          rm -f "$SYFT_TARBALL" "$TRIVY_TARBALL"
          syft version
          trivy --version
      - name: Login to Forgejo registry
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.FORGE_PUSH_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"forge.oddie.app\":{\"auth\":\"$F_AUTH\"}}}" > ~/.docker/config.json
      - name: Build, scan, attest, and push on tag
        run: |
          set -euo pipefail
          GW="$(node -e 'const fs=require("fs");for(const l of fs.readFileSync("/proc/net/route","utf8").split("\n").slice(1)){const f=l.trim().split(/\s+/);if(f[1]==="00000000"){const h=f[2];console.log([h.slice(6,8),h.slice(4,6),h.slice(2,4),h.slice(0,2)].map(x=>parseInt(x,16)).join("."));break;}}')"
          export BUILDKIT_HOST="tcp://${GW}:1234"
          echo "buildkitd at ${BUILDKIT_HOST}"
          CACHE_REF="forge.oddie.app/jlxq0/carddav-mcp:buildcache"
          LOCAL_TAG="carddav-mcp:ci-${GITHUB_SHA::8}"
          IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
          EXPORT_CACHE_ARG=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            EXPORT_CACHE_ARG=(--export-cache "type=registry,ref=${CACHE_REF},mode=max")
          fi

          # Produce a portable OCI archive first so scanning gates publication.
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt platform=linux/amd64 \
            "${IMPORT_CACHE_ARG[@]}" \
            "${EXPORT_CACHE_ARG[@]}" \
            --output "type=oci,dest=/tmp/carddav-mcp.oci.tar,name=${LOCAL_TAG}"

          mkdir -p /tmp/carddav-mcp.oci
          tar -xf /tmp/carddav-mcp.oci.tar -C /tmp/carddav-mcp.oci
          trivy image --input /tmp/carddav-mcp.oci \
            --severity HIGH,CRITICAL --exit-code 1
          trivy config . --severity HIGH,CRITICAL --exit-code 1
          syft "oci-archive:/tmp/carddav-mcp.oci.tar" \
            -o cyclonedx-json=carddav-mcp.cdx.json
          test -s carddav-mcp.cdx.json

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            TAGS="forge.oddie.app/jlxq0/carddav-mcp:${V},forge.oddie.app/jlxq0/carddav-mcp:latest"
            buildctl build \
              --frontend dockerfile.v0 \
              --local context=. \
              --local dockerfile=. \
              --opt platform=linux/amd64 \
              "${IMPORT_CACHE_ARG[@]}" \
              --opt attest:provenance=mode=max \
              --opt attest:sbom= \
              --metadata-file /tmp/carddav-mcp-build-metadata.json \
              --output "type=image,\"name=${TAGS}\",push=true"
            jq -e -r '."containerimage.digest"' \
              /tmp/carddav-mcp-build-metadata.json
          fi
